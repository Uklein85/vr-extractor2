name: Build EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        # --onefile собирает все в один exe
        # --noconsole скрывает черное окно консоли при запуске GUI
        pyinstaller --onefile --noconsole --name="PDF_to_Excel_Converter" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDF_to_Excel_EXE
        path: dist/PDF_to_Excel_Converter.exe
